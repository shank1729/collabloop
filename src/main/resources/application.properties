spring.application.name=collab-backend
server.port=${PORT:8080}
# Trust no forwarded address headers until a verified proxy is configured.
server.forward-headers-strategy=none
server.tomcat.remoteip.internal-proxies=${AUTH_TRUSTED_PROXIES:(?!)}

app.auth.rate-limit.requests=${AUTH_RATE_LIMIT_REQUESTS:20}
app.auth.rate-limit.window-seconds=${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
app.auth.rate-limit.max-clients=${AUTH_RATE_LIMIT_MAX_CLIENTS:10000}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/collabdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Database migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# API documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JWT settings
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Application metadata
info.app.name=collab-backend
info.app.description=Authenticated real-time collaborative document backend
info.app.java-version=17

# Actuator and observability
management.info.env.enabled=true
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.tags.application=${spring.application.name}

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
