name: realtime-collab

services:
  backend:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 2g
    stop_grace_period: 30s
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: '8080'
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in deploy/oracle/.env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in deploy/oracle/.env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-https://${APP_HOST:?Set APP_HOST in deploy/oracle/.env}}
      SERVER_FORWARD_HEADERS_STRATEGY: native
      # Only the gateway's fixed address is trusted. The backend has no public port.
      # Compose turns $$ into the literal regex end anchor.
      AUTH_TRUSTED_PROXIES: '^172[.]29[.]73[.]2$$'
      AUTH_RATE_LIMIT_REQUESTS: ${AUTH_RATE_LIMIT_REQUESTS:-20}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-60}
      AUTH_RATE_LIMIT_MAX_CLIENTS: ${AUTH_RATE_LIMIT_MAX_CLIENTS:-10000}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: '5'
      JAVA_TOOL_OPTIONS: '-XX:MaxRAMPercentage=70.0'
    networks:
      app:
        ipv4_address: 172.29.73.3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  gateway:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: /api
        REACT_APP_WS_URL: /ws
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      - backend
    environment:
      APP_HOST: ${APP_SITE_ADDRESSES:-${APP_HOST:?Set APP_HOST in deploy/oracle/.env}}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      app:
        ipv4_address: 172.29.73.2
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

networks:
  app:
    ipam:
      config:
        - subnet: 172.29.73.0/24

volumes:
  caddy_data:
  caddy_config:
