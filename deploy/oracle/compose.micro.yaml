# Standalone configuration for the 1 GB Always Free E2 Micro VM.
# Build the JAR and React assets locally; see README.md. Do not combine with compose.yaml.
name: realtime-collab

services:
  backend:
    image: eclipse-temurin:17-jre-alpine
    working_dir: /app
    command: ['java', '-jar', '/app/app.jar']
    restart: unless-stopped
    mem_limit: 640m
    stop_grace_period: 30s
    volumes:
      - ./release/app.jar:/app/app.jar:ro
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: '8080'
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in deploy/oracle/.env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in deploy/oracle/.env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-https://${APP_HOST:?Set APP_HOST in deploy/oracle/.env}}
      SERVER_FORWARD_HEADERS_STRATEGY: native
      AUTH_TRUSTED_PROXIES: '^172[.]29[.]73[.]2$$'
      AUTH_RATE_LIMIT_REQUESTS: ${AUTH_RATE_LIMIT_REQUESTS:-20}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-60}
      AUTH_RATE_LIMIT_MAX_CLIENTS: '1000'
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: '3'
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: '1'
      SERVER_TOMCAT_THREADS_MAX: '30'
      SERVER_TOMCAT_THREADS_MIN_SPARE: '2'
      JAVA_TOOL_OPTIONS: '-Xms64m -Xmx256m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=48m -XX:MaxDirectMemorySize=32m -Xss512k -XX:ActiveProcessorCount=1 -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError'
    networks:
      app:
        ipv4_address: 172.29.73.3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      - backend
    environment:
      APP_HOST: ${APP_SITE_ADDRESSES:-${APP_HOST:?Set APP_HOST in deploy/oracle/.env}}
      GOMEMLIMIT: 64MiB
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./release/frontend:/srv:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      app:
        ipv4_address: 172.29.73.2
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

networks:
  app:
    ipam:
      config:
        - subnet: 172.29.73.0/24

volumes:
  caddy_data:
  caddy_config:
