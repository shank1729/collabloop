name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify backend
        run: sh ./mvnw --batch-mode --no-transfer-progress verify

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false --runInBand
      - run: npm run build

  container:
    name: Deployment Docker builds
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker build --tag realtime-collab-backend:ci .
      - name: Validate Oracle Compose configuration
        env:
          APP_HOST: collab.example.invalid
          DATABASE_URL: postgresql://ci:unused@example.invalid/collab?sslmode=require
          JWT_SECRET: test-ci-configuration-key-not-for-production
        run: docker compose -f deploy/oracle/compose.yaml config --quiet
      - name: Build frontend gateway
        run: docker build --tag realtime-collab-gateway:ci --build-arg REACT_APP_WS_URL=https://collab.example.invalid/ws frontend
      - name: Validate Caddy routes without launching the app
        run: docker run --rm -e APP_HOST=collab.example.invalid -v "$PWD/deploy/oracle/Caddyfile:/etc/caddy/Caddyfile:ro" realtime-collab-gateway:ci caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
